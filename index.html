<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamar Dobrin | AI</title>
<meta name="description" content="Tamar Dobrin | AI">
<meta property="og:title" content="Tamar Dobrin | AI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f5;
    --ink: #222222;
    --muted: #6b6560;
    --accent: #d97757;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #181614; --ink: #f2eee9; --muted: #a8a099; --accent: #e08a6c; --accent-ink: #1a1512;
    }
  }
  :root[data-theme="dark"] {
    --bg: #181614; --ink: #f2eee9; --muted: #a8a099; --accent: #e08a6c; --accent-ink: #1a1512;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    padding: 24px 16px;
  }
  main { text-align: center; }
  h1 {
    direction: ltr;
    margin: 0;
    font-weight: 900;
    font-size: clamp(22px, 7vw, 84px);
    line-height: 1.05;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  h1 .sep { color: var(--muted); font-weight: 500; margin: 0 0.18em; }
  h1 .ai { color: var(--accent); }
  .go {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 36px;
    padding: 16px 30px;
    border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 19px; font-weight: 700;
    text-decoration: none;
    transition: transform .12s ease, filter .12s ease;
  }
  .go:hover { filter: brightness(1.05); }
  .go:active { transform: scale(.98); }
  .go svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
<body>
<main>
  <h1>TAMAR DOBRIN<span class="sep">|</span><span class="ai">AI</span></h1>
  <a class="go" href="/skills/">
    למעבר לסקילים
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
  </a>
</main>
</body>
</html>
